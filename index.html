:root{--navy:#0D0A3F;--cyan:#3FD8FF;--cyan2:#7FE3FF;--violet:#7B5CFF;--coral:#FF4D6D;--orange:#FFB547;--lav:#C9CBF2}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#0C0939;font-family:'Plus Jakarta Sans',sans-serif;color:#fff;transform-origin:0 0;-webkit-font-smoothing:antialiased}
#bg,#bg>div{position:absolute;inset:0}
.glow{position:absolute;border-radius:50%;pointer-events:none}
#hdr{position:absolute;left:72px;right:72px;top:46px;height:48px;display:flex;align-items:center;justify-content:space-between;z-index:20}
.logo{display:flex;align-items:center}
.logo img{height:56px;width:auto;display:block}
.part{position:relative;height:30px;width:700px;display:none}
.part span{position:absolute;right:0;top:0;font-size:20px;font-weight:600;color:#C9CBF2;white-space:nowrap}
#prog{position:absolute;left:72px;right:72px;top:1031px;height:3px;border-radius:2px;background:rgba(255,255,255,0.10);z-index:20;overflow:hidden}
#prog i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#3FD8FF,#7B5CFF);border-radius:2px}
.cap{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;z-index:5;pointer-events:none}
.cap .eb{font-size:21px;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:#3FD8FF}
.cap .ti{margin-top:0;font-size:66px;font-weight:800;letter-spacing:-1.9px;line-height:1.08}
.cap .de{margin-top:26px;font-size:27px;font-weight:500;line-height:1.42;color:#B9BCEB;max-width:640px}
.cap.L{left:150px;width:800px}
.cap.R{left:1090px;width:700px}
.cap.C{left:0;right:0;align-items:center;text-align:center}
.cap.C .ti{font-size:84px;letter-spacing:-2.6px;line-height:1.04}
.cap.C .de{max-width:1100px;font-size:30px;margin-top:30px}
.cap.T{left:0;right:0;top:150px;bottom:auto;align-items:center;text-align:center}
.cap.T .ti{font-size:54px;letter-spacing:-1.5px;margin-top:0}
.cap.T .de{max-width:1300px;font-size:25px;margin-top:16px}
.cap.E .de{color:#7FE3FF;font-weight:700;font-size:34px;letter-spacing:0.5px}
.cap .endlogo{height:190px;width:auto;display:block}
#stage.port .cap .endlogo{height:118px}
.cap .sm{margin-top:56px;font-size:18px;font-weight:500;color:#8E91C8;letter-spacing:0.3px}
#values{position:absolute;inset:0;z-index:6;pointer-events:none}
/* opening slide: title + chapter menu */
#menu{position:absolute;inset:0;z-index:12;display:flex;align-items:center;gap:100px;padding:40px 150px 0;box-sizing:border-box}
#menu .mhead{flex:0 0 620px;display:flex;flex-direction:column;align-items:flex-start;gap:56px}
#menu .mti{font-size:136px;font-weight:800;letter-spacing:-4.5px;line-height:0.96}
#menu .mplay{display:inline-flex;align-items:center;gap:20px;height:92px;padding:0 44px 0 16px;border-radius:46px;border:0;background:#FFFFFF;color:#0D0A3F;font:800 32px 'Plus Jakarta Sans',sans-serif;letter-spacing:-0.4px;cursor:pointer;box-shadow:0 20px 50px rgba(0,0,0,0.35)}
#menu .mplay i{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#3FD8FF,#7B5CFF);display:flex;align-items:center;justify-content:center}
#menu .mlist{flex:1;display:flex;flex-direction:column;border-top:1px solid rgba(255,255,255,0.14)}
#menu .mrow{display:flex;align-items:center;gap:30px;height:98px;padding:0 14px;border:0;border-bottom:1px solid rgba(255,255,255,0.14);background:transparent;color:#FFFFFF;font:700 36px 'Plus Jakarta Sans',sans-serif;letter-spacing:-0.6px;text-align:left;cursor:pointer;transition:background .15s}
#menu .mrow b{width:60px;flex:0 0 auto;color:#3FD8FF;font-weight:800;font-size:27px;letter-spacing:0;font-variant-numeric:tabular-nums}
#menu .mrow span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menu .mrow em{font-style:normal;font-weight:600;font-size:25px;letter-spacing:0;color:#8E91C8;font-variant-numeric:tabular-nums}
#menu .mrow:hover{background:rgba(63,216,255,0.08)}
#menu .mrow:hover span{color:#7FE3FF}
#menu button:focus-visible{outline:4px solid #3FD8FF;outline-offset:4px}
/* portrait composition (phones held upright) */
#stage.port{width:1080px;height:1620px}
#stage.port #hdr{left:56px;right:56px}
#stage.port #prog{left:56px;right:56px;top:1592px}
#stage.port .cap{left:70px;right:70px;width:auto;top:112px;bottom:auto;height:300px;align-items:center;text-align:center;justify-content:center}
#stage.port .cap .ti{font-size:60px;letter-spacing:-1.6px;line-height:1.1}
#stage.port .cap.C{top:0;bottom:0;height:auto}
#stage.port .cap.C .ti{font-size:100px;letter-spacing:-3px}
#stage.port .cap.T .ti{font-size:58px}
#stage.port #values .vh{top:250px;left:70px;right:70px}
#stage.port #values .vh .ti{font-size:66px}
#stage.port .vcards{left:90px;right:90px;top:560px;flex-direction:column;gap:34px}
#stage.port .vc{height:auto;flex:0 0 auto;display:flex;align-items:center;gap:36px;padding:40px 44px}
#stage.port .vc .vt{margin-top:0;font-size:46px}
#stage.port #menu{flex-direction:column;align-items:stretch;justify-content:center;gap:76px;padding:60px 70px 0}
#stage.port #menu .mhead{flex:0 0 auto;align-items:center;gap:48px}
#stage.port #menu .mlist{flex:0 0 auto}
#stage.port #menu .mti{font-size:128px;text-align:center}
#stage.port #menu .mplay{height:104px;font-size:38px;padding:0 50px 0 18px}
#stage.port #menu .mplay i{width:72px;height:72px}
#stage.port #menu .mrow{height:122px;font-size:46px;gap:34px}
#stage.port #menu .mrow b{font-size:34px;width:70px}
#stage.port #menu .mrow em{font-size:32px}
#values .vh{position:absolute;left:0;right:0;top:250px;text-align:center}
#values .vh .eb{font-size:21px;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:#3FD8FF}
#values .vh .ti{margin-top:0;font-size:60px;font-weight:800;letter-spacing:-1.8px;line-height:1.08}
.vcards{position:absolute;left:150px;right:150px;top:470px;display:flex;gap:46px}
.vc{flex:1;height:270px;box-sizing:border-box;padding:42px 40px;border-radius:30px;background:linear-gradient(160deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));border:1px solid rgba(255,255,255,0.13);box-shadow:0 30px 60px rgba(0,0,0,0.25)}
.vc .vic{width:76px;height:76px;border-radius:20px;background:linear-gradient(135deg,#3FD8FF,#7B5CFF);display:flex;align-items:center;justify-content:center;color:#0D0A3F}
.vc .vt{margin-top:34px;font-size:34px;font-weight:800;letter-spacing:-0.8px;line-height:1.15}
.vc .vd{margin-top:16px;font-size:22px;line-height:1.45;color:#B9BCEB}
/* phones */
.phone{position:absolute;left:0;top:0;width:416px;height:870px;border-radius:64px;box-sizing:border-box;padding:13px;
  background:linear-gradient(150deg,#34315f 0%,#1a1840 45%,#121032 100%);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,0.16),inset 0 0 0 5px rgba(0,0,0,0.25),0 60px 120px rgba(0,0,0,0.55),0 0 120px rgba(123,92,255,0.20);
  will-change:transform;z-index:8}
.phone .btn1,.phone .btn2,.phone .btn3{position:absolute;width:4px;border-radius:2px;background:#2c2958}
.phone .btn1{left:-3px;top:190px;height:64px}.phone .btn2{left:-3px;top:270px;height:64px}.phone .btn3{right:-3px;top:230px;height:100px}
.screen{position:relative;width:390px;height:844px;border-radius:52px;overflow:hidden;background:#0D0A3F;isolation:isolate}
.layer{position:absolute;left:0;top:0;width:390px;height:844px;display:none;transform-origin:50% 50%}
.layer>div{transform-origin:50% 0}
.sb{position:absolute;left:0;right:0;top:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 40px;box-sizing:border-box;z-index:30;pointer-events:none;font-size:16px;font-weight:700;letter-spacing:-0.2px}
.sb svg{display:block}
.sbbg{position:absolute;left:0;right:0;top:0;height:62px;z-index:29;opacity:0;pointer-events:none;background:linear-gradient(180deg,#0D0A3F 0%,rgba(13,10,63,0.96) 62%,rgba(13,10,63,0) 100%)}
.homebar{position:absolute;left:50%;bottom:8px;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:rgba(255,255,255,0.75);z-index:30}
.confetti{position:absolute;left:0;top:0;z-index:25;pointer-events:none}
.jump{position:absolute;inset:0;z-index:40;background:radial-gradient(90% 60% at 50% 45%,#2A2AB8 0%,#0D0A3F 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:0;pointer-events:none}
.jump .jt{font-size:28px;font-weight:800;letter-spacing:-0.5px;text-align:center;padding:0 30px}
.jump .jc{width:64px;height:64px;border-radius:32px;border:3px solid #3FD8FF;position:relative}
.jump .jc:before,.jump .jc:after{content:"";position:absolute;left:29px;bottom:29px;width:3px;border-radius:2px;background:#3FD8FF;transform-origin:50% 100%}
.jump .jc:before{height:20px}.jump .jc:after{height:14px;transform:rotate(90deg)}
.flash{position:absolute;inset:0;background:#fff;z-index:45;opacity:0;pointer-events:none}
.finger{position:absolute;left:0;top:0;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:25px;background:rgba(255,255,255,0.38);border:2px solid rgba(255,255,255,0.85);box-shadow:0 6px 18px rgba(0,0,0,0.35),inset 0 0 12px rgba(255,255,255,0.35);z-index:50;opacity:0;pointer-events:none;box-sizing:border-box}
.ripple{position:absolute;left:0;top:0;border-radius:50%;border:2.5px solid rgba(255,255,255,0.9);z-index:49;opacity:0;pointer-events:none;box-sizing:border-box}

#wideIn{position:absolute;left:0;top:0;transform-origin:0 0}
#playhead{position:absolute;border:2.5px solid #3FD8FF;border-radius:18px;box-shadow:0 0 0 6px rgba(63,216,255,0.12),0 0 40px rgba(63,216,255,0.35);opacity:0;pointer-events:none;box-sizing:border-box}
.shock{position:absolute;border-radius:50%;border:4px solid #3FD8FF;opacity:0;pointer-events:none;z-index:9;box-sizing:border-box}
.heart{position:absolute;left:0;top:0;opacity:0;pointer-events:none;z-index:5}

/* Layout: a screening-room page — film frame centred, transport bar under it (overlaid and auto-hiding in full screen), chapter strip. Single dark look. */
:root{color-scheme:dark;
  --bg:#07061F; --panel:#100D3A; --line:rgba(201,203,242,0.16); --fg:#EEEFFF; --muted:#A9ACDF;
  --accent:#3FD8FF; --accent2:#7B5CFF; --ink:#0D0A3F;
  --ui:'Plus Jakarta Sans',system-ui,sans-serif}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--ui);padding:20px 16px 32px;-webkit-font-smoothing:antialiased}
html.pfs-on,html.pfs-on body{overflow:hidden}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:36px;height:36px;flex:0 0 auto;display:block}
.brand h1{margin:0;font-size:clamp(16px,2.2vw,22px);font-weight:800;letter-spacing:-0.4px;text-wrap:balance}
.brand p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;flex:0 0 auto;padding:3px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.seg button{font:700 13px/1 var(--ui);letter-spacing:0.6px;color:var(--muted);background:transparent;border:0;border-radius:999px;padding:10px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--ink)}

/* player: frame + bar; width chosen so frame and bar fit in the viewport */
.player{position:relative;width:min(100%, max(560px, calc((100vh - 220px) * 16 / 9)));width:min(100%, max(560px, calc((100svh - 220px) * 16 / 9)));margin:0 auto;display:flex;flex-direction:column;gap:10px}
.player.port{width:min(100%, calc((100vh - 150px) * 2 / 3));width:min(100%, calc((100svh - 150px) * 2 / 3))}
@media (max-height:520px) and (orientation:landscape){.player{width:min(100%, calc((100vh - 70px) * 16 / 9));width:min(100%, calc((100svh - 70px) * 16 / 9))}}
.frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#0C0939;box-shadow:0 30px 80px rgba(0,0,0,0.45),0 0 0 1px var(--line);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.player.port .frame{aspect-ratio:2/3}
.frame #stage{position:absolute;left:0;top:0}
.frame #phones,.frame #wide,.frame #caps,.frame #values,.frame #hdr,.frame #bg{pointer-events:none}
.big{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:rgba(7,6,31,0.55);border:1.5px solid rgba(238,239,255,0.5);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:none}

.bar{display:flex;align-items:center;gap:10px;min-width:0}
.btn{width:42px;height:42px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.btn:hover{border-color:var(--accent)}
.btn.txt{width:auto;min-width:54px;padding:0 12px;border-radius:21px;font:800 13px var(--ui);font-variant-numeric:tabular-nums}
.track{position:relative;flex:1 1 auto;min-width:60px;height:42px;display:flex;align-items:center}
.track input{width:100%;margin:0;appearance:none;-webkit-appearance:none;background:transparent;height:42px;cursor:pointer;position:relative;z-index:2;touch-action:none}
.track input::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:transparent}
.track input::-moz-range-track{height:4px;background:transparent}
.track input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:var(--fg);box-shadow:0 0 0 4px rgba(63,216,255,0.25)}
.track input::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--fg)}
@media (pointer:coarse){.track input::-webkit-slider-thumb{width:22px;height:22px;margin-top:-9px}.track input::-moz-range-thumb{width:22px;height:22px}}
.rail{position:absolute;left:0;right:0;top:19px;height:4px;border-radius:2px;background:var(--line);overflow:hidden;z-index:1}
.rail i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.tick{position:absolute;top:15px;width:2px;height:12px;border-radius:1px;background:rgba(238,239,255,0.35);z-index:1;transform:translateX(-1px)}
.time{font:600 13px var(--ui);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.chap-now{font:700 13px var(--ui);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.spd{position:relative;flex:0 0 auto}
.spdm{position:absolute;right:0;bottom:calc(100% + 8px);min-width:132px;padding:6px;border-radius:14px;background:#15123F;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,0.5);display:flex;flex-direction:column;z-index:30}
.spdm .lab{font:700 11px var(--ui);letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:8px 12px 6px}
.spdm button{font:700 14px var(--ui);font-variant-numeric:tabular-nums;color:var(--fg);background:transparent;border:0;border-radius:9px;padding:11px 12px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:14px}
.spdm button:hover{background:rgba(255,255,255,0.07)}
.spdm button[aria-checked="true"]{color:var(--accent)}
.spdm button[aria-checked="true"]::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* full screen (native, or the fixed-position fallback used on iPhone): bar overlays the bottom and hides while playing */
.player.fs{position:fixed;inset:0;width:auto;margin:0;z-index:9999;background:#000;display:block}
.player.fs .frame{position:absolute;border-radius:0;box-shadow:none;aspect-ratio:auto}
.player.fs .bar{position:absolute;left:0;right:0;bottom:0;z-index:10;padding:36px max(18px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));background:linear-gradient(180deg,rgba(3,2,20,0),rgba(3,2,20,0.88) 70%);transition:opacity .25s ease,transform .25s ease}
.player.fs .btn{background:rgba(16,13,58,0.85)}
.player.fs.idle .bar{opacity:0;transform:translateY(14px);pointer-events:none}
.player.fs.nocur,.player.fs.nocur .frame{cursor:none}

.chaps{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.chaps button{flex:0 0 auto;font:600 13px var(--ui);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 14px;cursor:pointer;white-space:nowrap}
.chaps button b{color:var(--accent);font-weight:800;margin-right:6px;font-variant-numeric:tabular-nums}
.chaps button[aria-current="true"]{color:var(--fg);border-color:var(--accent);background:rgba(63,216,255,0.10)}
.note{margin:0;font-size:13px;color:var(--muted);line-height:1.5;max-width:70ch}
@media (max-width:640px){
  body{padding:12px 12px 24px}
  .wrap{gap:12px}
  .brand img{width:32px;height:32px}
  .brand p{font-size:12px}
  .bar{gap:8px}
  .chap-now{display:none}
  .btn{width:40px;height:40px}
  .btn.txt{min-width:48px;padding:0 10px}
  .time{font-size:12px}
  .note{font-size:12px}
}
@media (max-width:380px){.time{display:none}}
[hidden]{display:none!important}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

</style>
</head>

function phoneState(t){
  let b={x:RX,y:1000,r:0,s:1,ry:0,o:0};
  for(const e of PEV){
    if(t<e.t)break;
    const p=e.d?clamp((t-e.t)/e.d):1;
    if(e.k==='rise'){const q=EZ.out5(p);b={x:e.x,y:lerp(900,0,q),r:lerp(6,0,q),s:1,ry:0,o:clamp(p*3)}}
    else if(e.k==='fly'){const q=EZ.io(p),dir=Math.sign(e.x-b.x),k=Math.sin(Math.PI*q);
      if(p<1)return{x:lerp(b.x,e.x,q),y:-18*k,r:-dir*9*k,s:1-0.07*k,ry:0,o:1};b={...b,x:e.x}}
    else if(e.k==='move'){const q=EZ.io(p);if(p<1)return{...b,x:lerp(b.x,e.x,q)};b={...b,x:e.x}}
    else if(e.k==='flip'){if(p<1){const ry=p<.5?lerp(0,90,EZ.in(p*2)):lerp(-90,0,EZ.out(p*2-1));return{...b,ry}}}
    else if(e.k==='hide'){b={...b,o:0}}
    else if(e.k==='show'){b={...b,o:1}}
    else if(e.k==='exit'){const q=EZ.in(p);b={...b,y:lerp(0,1050,q),r:lerp(0,-5,q),o:1-clamp((p-0.6)/0.4)}}
  }
  return b;
}

/* ---------------- finger gestures ---------------- */
const G=[]; // {k:'tap'|'hold'|'swipe', t, d, a:[x,y], b:[x,y]}
function tap(t,a){G.push({k:'tap',t,a})}
function hold(t,d,a){G.push({k:'hold',t,d,a,b:a})}
function swipe(t,d,a,b){G.push({k:'swipe',t,d,a,b})}
const FKF=[];
function buildFinger(){
  G.sort((x,y)=>x.t-y.t);
  let last=null;const kf=FKF;
  for(const g of G){
    const ts=g.t,Sp=g.a;
    if(last&&ts-last.te<1.05){kf.push({t:last.te+0.1,x:last.E[0],y:last.E[1],o:1,p:0});kf.push({t:ts-0.06,x:Sp[0],y:Sp[1],o:1,p:0})}
    else{
      if(last){kf.push({t:last.te+0.28,x:last.E[0],y:last.E[1],o:1,p:0});kf.push({t:last.te+0.58,x:last.E[0]+34,y:last.E[1]+70,o:0,p:0})}
      kf.push({t:ts-0.55,x:Sp[0]+44,y:Sp[1]+90,o:0,p:0});kf.push({t:ts-0.08,x:Sp[0],y:Sp[1],o:1,p:0});
    }
    kf.push({t:ts,x:Sp[0],y:Sp[1],o:1,p:1});
    if(g.k==='tap'){kf.push({t:ts+0.16,x:Sp[0],y:Sp[1],o:1,p:0});last={te:ts+0.16,E:Sp}}
    else{kf.push({t:ts+g.d,x:g.b[0],y:g.b[1],o:1,p:1});kf.push({t:ts+g.d+0.1,x:g.b[0],y:g.b[1],o:1,p:0});last={te:ts+g.d+0.1,E:g.b}}
  }
  if(last){kf.push({t:last.te+0.28,x:last.E[0],y:last.E[1],o:1,p:0});kf.push({t:last.te+0.58,x:last.E[0]+34,y:last.E[1]+70,o:0,p:0})}
}
function fingerAt(t){
  const kf=FKF;if(!kf.length||t<kf[0].t||t>kf[kf.length-1].t)return null;
  let i=0;while(i<kf.length-1&&kf[i+1].t<=t)i++;
  const a=kf[i],b=kf[Math.min(i+1,kf.length-1)];const p=b.t>a.t?EZ.io(clamp((t-a.t)/(b.t-a.t))):1;
  return{x:lerp(a.x,b.x,p),y:lerp(a.y,b.y,p),o:lerp(a.o,b.o,p),p:lerp(a.p,b.p,p)};
}

/* ---------------- confetti ---------------- */
const BURSTS=[];
function burst(t,x,y,n,pow){BURSTS.push({t,x,y,n:n||70,pow:pow||1,seed:Math.round(t*1000)})}
const CCOL=['#3FD8FF','#7B5CFF','#FF4D6D','#FFB547','#FFFFFF','#7FE3FF','#FFE29A'];
let CONF_MIN=-1e9; // bursts older than this are not drawn (set around inserted scenes)
function drawConfetti(ctx,t){
  ctx.clearRect(0,0,390,844);
  for(const b of BURSTS){
    const dt=t-b.t;if(dt<0||dt>2.6||b.t<CONF_MIN)continue;
    const r=rng(b.seed);const g=950,k=1.5;
    for(let i=0;i<b.n;i++){
      const a=-Math.PI/2+(r()-0.5)*2.4;const v=(420+r()*620)*b.pow;
      const vx=Math.cos(a)*v,vy=Math.sin(a)*v;const e=(1-Math.exp(-k*dt))/k;
      const x=b.x+vx*e+ (r()-0.5)*30*dt;const y=b.y+g/k*dt+(vy-g/k)*e;
      const w=5+r()*5,h=8+r()*7,rot=r()*6+dt*(r()*10-5),fl=Math.cos(dt*(6+r()*8));
      const col=CCOL[Math.floor(r()*CCOL.length)];const al=clamp((2.6-dt)/0.7);
      if(y>880)continue;
      ctx.save();ctx.globalAlpha=al;ctx.translate(x,y);ctx.rotate(rot);ctx.scale(1,fl);ctx.fillStyle=col;
      if(i%5===0){ctx.beginPath();ctx.arc(0,0,w*0.55,0,Math.PI*2);ctx.fill()}else ctx.fillRect(-w/2,-h/2,w,h);
      ctx.restore();
    }
  }
}

/* ---------------- layers ---------------- */
function layerStates(t){
  // returns map code -> {x,o,s,b(brightness)}
  const out={};
  let i=-1;for(let k=0;k<SEQ.length;k++){if(SEQ[k].t<=t)i=k}
  if(i<0)return{out,cur:null};
  const cur=SEQ[i],prev=SEQ[i-1],next=SEQ[i+1];
  const dt=t-cur.t;
  const cs={x:0,o:1,s:1,b:1};
  if(cur.tr==='push'&&dt<0.5&&prev){const p=EZ.io(dt/0.5);cs.x=390*(1-p);out[prev.c]={x:-110*p,o:1,s:1,b:1-0.4*p}}
  else if(cur.tr==='pop'&&dt<0.45&&prev){const p=EZ.out(dt/0.45);cs.o=p;cs.s=0.94+0.06*p;out[prev.c]={x:0,o:1-p,s:1+0.03*p,b:1}}
  else if(cur.tr==='fade'&&dt<0.4&&prev){const p=EZ.io(dt/0.4);cs.o=p;out[prev.c]={x:0,o:1-p,s:1,b:1}}
  else if(cur.tr==='enter'){cs.o=P(t,cur.t,0.3)}
  if(next&&next.tr==='enter'&&t>=next.out)cs.o*=1-P(t,next.out,0.25);
  if(cur.fade&&t>=cur.fade)cs.o*=1-P(t,cur.fade,0.2);
  out[cur.c]=cs;
  return{out,cur};
}
function cascade(Ly,t0,t){
  const n=Ly.cas.length;
  Ly.cas.forEach((e,k)=>{const d=0.04+Math.min(k,12)*0.055;const p=P(t,t0+d,0.5,'out');
    st(e,'opacity',p>=1?'':String(p));st(e,'translate',p>=1?'':`0 ${(1-p)*22}px`)});
}

{let r=+HP.r;if(!RATES.includes(r)){try{r=+localStorage.getItem('nova-rate')}catch(e){}}setRate(RATES.includes(r)?r:1)}
